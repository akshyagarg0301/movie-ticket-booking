spring.application.name=movie-ticket-booking
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/cinema;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=16
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
server.error.include-message=never
cinema.hold-minutes=5
cinema.jobs.enabled=true
cinema.jobs.delay-ms=5000
cinema.admin.username=${ADMIN_USERNAME:admin}
cinema.admin.password=${ADMIN_PASSWORD:}
